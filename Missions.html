<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missions | Kshitij Rocketry</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-black text-slate-100 font-sans selection:bg-amber-500 selection:text-slate-900 antialiased">

    <nav class="w-full bg-black py-4 px-4 sm:px-6 lg:px-8 border-b border-slate-900">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full border border-white/20 bg-slate-900 overflow-hidden flex items-center justify-center">
                    <img src="circle84-5.png" alt="IISER logo" class="w-full h-full object-cover">
                </div>
                <span class="text-xl font-extrabold tracking-wide text-white self-center">
                    Kshitij
                </span>
            </a>
            <div class="flex items-center gap-6 sm:gap-8">
                <a href="index.html#about" class="text-sm font-medium text-slate-300 hover:text-white transition self-center">About</a>
                <a href="index.html#join" class="bg-amber-500 px-5 py-2 text-sm font-semibold text-slate-900 hover:bg-amber-400 transition shadow-sm self-center">Join Group</a>
            </div>
        </div>
    </nav>

    <header class="pt-20 pb-8 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto border-b border-slate-900">
        <p class="text-xs font-mono tracking-[0.25em] uppercase text-slate-400">Page</p>
        <h1 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
            All Club
        </h1>
        <h1 class="mt-2 text-3xl sm:text-4xl font-extrabold tracking-tight text-white">
            Missions
        </h1>
    </header>

    <main class="w-full bg-white text-slate-900 py-12 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <div class="w-full grid grid-cols-1 md:grid-cols-12 gap-8 items-start group">
                
                <div class="md:col-span-4 flex flex-col space-y-4">
                    <div class="w-full h-[240px] bg-[#4a0e10] rounded-sm overflow-hidden relative border border-slate-200 shadow-sm flex items-center justify-center">
                        <div class="absolute inset-0 bg-rose-600 mix-blend-multiply z-10"></div>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/20 z-15"></div>
                        <div class="absolute inset-0 flex items-center justify-center p-6 z-20">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b1/IN-SPACe_Logo.png" alt="IN-Space logo" class="w-full h-full object-contain max-h-[65%] transform group-hover:scale-105 transition duration-500">
                        </div>
                    </div>
                    
                    <div class="space-y-1 font-mono text-xs text-slate-400">
                        <div>ID: <span class="text-slate-700 font-medium">MSN-01</span></div>
                        <div>STATUS: <span class="text-yellow-500 font-bold">IN-PROGRESS</span></div>
                    </div>

                    <div class="bg-slate-50 p-4 border border-slate-200/60 rounded-sm min-h-[110px]">
                        <h4 class="text-xs font-mono text-slate-400 uppercase tracking-wider">Metrics Panel</h4>
                        <div class="mt-2 space-y-1 text-sm font-semibold text-slate-800">
                            <p>Apogee Goal: <span class="font-normal text-slate-600">1000M</span></p>
                            <p>Telemetry: <span class="font-normal text-slate-600">??</span></p>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-8 flex flex-col justify-between space-y-8">
                    
                    <div>
                        <span class="text-xs font-mono tracking-widest text-slate-400 uppercase">Mission</span>
                        <h3 class="mt-2 text-3xl font-extrabold text-slate-900 tracking-tight group-hover:text-amber-500 transition">IN-Space</h3>
                        <p class="mt-3 text-base text-slate-600 leading-relaxed max-w-3xl">
                            First rocket to be built by the team.
                        </p>
                    </div>

                    <div class="pt-6 border-t border-slate-100">
                        <h4 class="text-xs font-mono text-slate-400 uppercase tracking-wider mb-3">Gallery Assets</h4>
                        <div class="flex flex-wrap gap-3">
                            <div class="w-24 h-24 bg-slate-100 border border-slate-200 rounded-sm overflow-hidden flex-shrink-0">
                                <img src="logo-patch.png" alt="Thumb 1" class="w-full h-full object-cover opacity-80 hover:opacity-100 transition">
                            </div>
                            <div class="w-24 h-24 bg-slate-100 border border-slate-200 rounded-sm overflow-hidden flex-shrink-0 flex items-center justify-center text-slate-300 text-xl font-bold">
                                +
                            </div>
                        </div>
                    </div>

                    <div class="pt-6 border-t border-slate-100">
                        <h4 class="text-xs font-mono text-slate-400 uppercase tracking-wider mb-3">Mission Documents</h4>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            
                            <a href="downloads/flight-log-msn01.pdf" download class="group/dl flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-sm hover:bg-slate-100 transition">
                                <div class="flex items-center gap-3 overflow-hidden">
                                    <div class="w-8 h-8 bg-red-50 text-red-600 border border-red-100 rounded-sm flex items-center justify-center shrink-0 font-mono text-[10px] font-bold">
                                        PDF
                                    </div>
                                    <div class="truncate">
                                        <h5 class="text-xs font-semibold text-slate-800 truncate group-hover/dl:text-amber-600 transition">Docs</h5>
                                    </div>
                                </div>
                                <span class="text-slate-400 group-hover/dl:translate-y-0.5 transition duration-300 text-sm font-bold mr-1">↓</span>
                            </a>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <footer class="bg-slate-950 py-12 text-center text-slate-500 text-sm">
        <p class="mb-4 text-slate-300">Kshitij IISER Pune.</p>
        <p class="text-xs">&copy; Join our groups.</p>
    </footer>

</body>
</html>
